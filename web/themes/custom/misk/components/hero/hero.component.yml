$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json

name: Hero
group: Advanced components
description: A Hero section with inline styles for testing purposes

props:
  type: object
  properties:
    bg_image:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Image
      description: The image to use.
      examples:
        - src: placeholder.jpg
          alt: 'Placeholder image'
          width: 2560
          height: 1707

    bg_color:
      $ref: json-schema-definitions://sdc_components.module/color-background
      type: string
      title: Background color

    tertiary:
      type: boolean
      title: Tertiary
      description: Use the tertiary background color.
      default: false

    tertiary_hover:
      type: boolean
      title: Tertiary Hover
      description: Use the tertiary hover background color.
      default: false

    bg_position:
      type: string
      title: Background position
      enum:
        - bg-center
        - bg-top
        - bg-bottom
      'meta:enum':
        bg-center: Centered (top and bottom of image may not be visible)
        bg-top: Top (Bottom of image may not be visible)
        bg-bottom: Bottom (Top of image may not be visible)
      examples:
        - 'bg-center'

    bg_video:
      title: Background video - video file
      type: object
      $ref: json-schema-definitions://canvas.module/video
      description: Optionally add background video

    bg_youtube_url:
      type: string
      format: uri-reference
      title: Background video - Youtube url
      description: Enter a youtube video url if you want to play a remote video rather than a local one

    hero_size:
      type: string
      title: Size
      enum:
        - ratio-8-1
        - ratio-7-1
        - ratio-6-1
        - ratio-5-1
        - ratio-4-1
        - ratio-3-1
        - ratio-8-3
        - ratio-5-2
        - ratio-21-9
        - ratio-2-1
        - ratio-16-9
        - fullscreen
      'meta:enum':
        ratio-8-1: Ratio 8 / 1
        ratio-7-1: Ratio 7 / 1
        ratio-6-1: Ratio 6 / 1
        ratio-5-1: Ratio 5 / 1
        ratio-4-1: Ratio 4 / 1
        ratio-3-1: Ratio 3 / 1
        ratio-8-3: Ratio 8 / 3
        ratio-5-2: Ratio 5 / 2
        ratio-21-9: Ratio 21 / 9
        ratio-2-1: Ratio 2 / 1
        ratio-16-9: Ratio 16 / 9
        fullscreen: Fullscreen
      default: ratio-3-1
      examples:
        - 'ratio-3-1'

    url:
      type: string
      format: uri-reference
      title: Url
      description: Optionally add a link around the hero

    new_tab:
      type: boolean
      title: Open link in new tab
      default: false
      examples:
        - false

    show_overlay:
      type: boolean
      title: Overlay
      description: Darken the image for better text readability by adding a black overlay on top of the image.
      default: false
      examples:
        - true

    parallax_effect:
      type: boolean
      title: Enable parallax effect
      description: The parallax effect moves the background image up while scrolling down.
      default: false
      examples:
        - false

    enable_scrolldown:
      type: boolean
      title: Add a scroll down button on the bottom
      description: Adds a button in the middle of the bottom of the hero.
      default: false
      examples:
        - false

    disable_lazy_loading:
      type: boolean
      title: Disable lazy loading
      description: Only check this box for images that are shown above the fold, so for images that are visible when opening the page.
      default: true
      examples:
        - true

    margin_top:
      $ref: json-schema-definitions://sdc_components.module/margin-top
      type: string
      title: Top margin (between this and the previous component)

    margin_bottom:
      $ref: json-schema-definitions://sdc_components.module/margin-bottom
      type: string
      title: Bottom margin (between this and the next component)

    animation:
      $ref: json-schema-definitions://sdc_components.module/animation
      type: string
      title: Animation

    animation_duration:
      $ref: json-schema-definitions://sdc_components.module/animation-duration
      type: integer
      title: Animation duration
      description: Time taken by the animation to complete.
      default: 2000

    extra_classes:
      type: array
      title: Extra classes
      items:
        type: string
      description: Optionally add extra classes to this component.

slots:
  content:
    title: Content
    description: The hero content.

libraryOverrides:
  dependencies:
    - core/drupal
    - core/once
  js:
    parallax.js: {}
    scroll-to.js: {}