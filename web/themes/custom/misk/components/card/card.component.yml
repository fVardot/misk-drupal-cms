$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/metadata.schema.json
name: Card
status: stable
description: 'A simple Bootstrap card with a heading, optional image, and body content.'
props:
  type: object
  properties:
    heading:
      type: string
      title: Heading
    image:
      type: string
      title: 'Image URL'
    url:
      type: string
      title: 'Link URL'
  required:
    - heading
slots:
  body:
    title: Body
    description: 'Main card content.'
