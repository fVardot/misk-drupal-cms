$schema: "https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json"

name: Card Logo
description: A logo card with an image and optional link.
group: Card
noUI: false

props:
  type: object
  properties:
    media:
      $ref: json-schema-definitions://canvas.module/image
      type: object
      title: Logo image
      description: Logo image displayed inside the card.
      examples:
        - src: "/components/foundation/images/assets/full-logo-dark.svg"
          alt: "Brand logo"
          width: 600
          height: 240

    url:
      type: string
      title: Link path
      description: The path or URL the logo links to.
      format: uri-reference
      default: ""
      examples:
        - "/example"